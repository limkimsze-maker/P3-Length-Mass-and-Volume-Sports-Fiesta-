name: Fix Actual 2P Gold
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix actual ceremony call
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sports-fiesta-medal-hook-v4.js')
          s=p.read_text(encoding='utf-8')
          old='w.showMedalCeremony(duelGold,winner,kind);'
          new='w.showMedalCeremony(false,winner,kind);'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Expected ceremony call not found')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-fiesta-medal-hook-v4.js
          git commit -m "Fix actual 2-player gold ceremony"
          git push
