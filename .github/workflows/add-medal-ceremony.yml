name: Add Medal Ceremony
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add medal ceremony, sounds and password preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'MEDAL_CEREMONY_START' in s:
              print('Medal ceremony already installed.')
              raise SystemExit(0)

          css = r'''
/* MEDAL_CEREMONY_START */
.previewCeremonyBtn{
  border:0;padding:12px 16px;border-radius:14px;
  background:linear-gradient(180deg,#8d72ff,#684adf);color:#fff;
  font-weight:900;font-size:15px;box-shadow:0 6px 0 rgba(72,49,157,.28);
  user-select:none
}
.previewCeremonyBtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(72,49,157,.28)}
#fiestaCover .fc-preview{
  display:block;margin:7px auto 0;border:0;border-radius:999px;padding:7px 15px;
  background:rgba(40,26,96,.86);color:#fff;font-weight:900;font-size:12px;
  box-shadow:0 4px 0 rgba(28,16,76,.28)
}
#fiestaCover .fc-preview:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(28,16,76,.28)}
#medalCeremony{
  position:fixed;inset:0;z-index:200000;display:none;align-items:center;justify-content:center;
  padding:14px;background:radial-gradient(circle at 50% 28%,rgba(255,250,199,.98),rgba(67,153,235,.97) 48%,rgba(30,86,157,.99));
  overflow:hidden;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif
}
#medalCeremony.show{display:flex;animation:ceremonyFade .35s ease-out both}
#medalCeremony .mc-stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff6a5 0 3px,transparent 4px),radial-gradient(circle,#fff 0 2px,transparent 3px);background-size:83px 77px,127px 109px;opacity:.55;animation:mcTwinkle 1.2s infinite alternate ease-in-out}
#medalCeremony .mc-card{
  position:relative;z-index:2;width:min(900px,96vw);min-height:min(660px,94vh);
  border:5px solid #fff3ad;border-radius:34px;background:linear-gradient(#eaf8ff 0 55%,#96d86c 55% 68%,#d4a06d 68% 100%);
  box-shadow:0 28px 75px rgba(9,42,84,.38),inset 0 0 0 4px rgba(255,255,255,.55);overflow:hidden;text-align:center
}
#medalCeremony .mc-banner{
  position:relative;margin:18px auto 0;width:min(700px,90%);padding:12px 18px;border-radius:18px;
  background:linear-gradient(180deg,#fff5a7,#f4bf2c);border:4px solid #fff;color:#774b00;
  font-size:clamp(22px,4vw,40px);font-weight:1000;text-shadow:0 2px 0 #fff;box-shadow:0 7px 0 #b67b14
}
#medalCeremony .mc-sub{margin:11px auto 0;font-weight:900;color:#174d7a;font-size:clamp(15px,2vw,22px)}
#medalCeremony .mc-stage{position:absolute;left:0;right:0;bottom:38px;height:440px}
#medalCeremony .mc-player{
  position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:4;
  width:230px;height:310px;object-fit:contain;filter:drop-shadow(0 13px 11px rgba(41,63,82,.25));
  animation:playerArrive .75s cubic-bezier(.22,.9,.3,1.2) both
}
#medalCeremony .mc-podium{
  position:absolute;left:50%;bottom:15px;transform:translateX(-50%) translateY(150px);z-index:3;
  width:290px;height:135px;border-radius:20px 20px 9px 9px;background:linear-gradient(180deg,#fff4b4,#efbd3b 48%,#d9961c);
  border:5px solid #fff0a1;box-shadow:0 11px 0 #9d6410,0 18px 24px rgba(91,57,10,.25);
  animation:podiumRise .65s .18s cubic-bezier(.22,.9,.3,1.1) forwards
}
#medalCeremony .mc-podium:before{content:"1";position:absolute;inset:5px 0 auto;font-size:82px;line-height:1;font-weight:1000;color:#fff;text-shadow:0 5px 0 #c58310,0 0 8px #b5740d}
#medalCeremony .mc-side{position:absolute;bottom:14px;width:145px;height:85px;border-radius:16px 16px 7px 7px;border:4px solid #eaf1f7;background:linear-gradient(#e8edf2,#b6c5d1);box-shadow:0 8px 0 #718593;opacity:.92}
#medalCeremony .mc-side.left{right:calc(50% + 151px)}
#medalCeremony .mc-side.right{left:calc(50% + 151px)}
#medalCeremony .mc-medal{
  position:absolute;left:50%;top:108px;z-index:6;transform:translate(-50%,-220px) scale(.55);opacity:0;
  width:96px;height:126px;transform-origin:center top
}
#medalCeremony .mc-medal:before,#medalCeremony .mc-medal:after{content:"";position:absolute;top:0;width:34px;height:65px;border-radius:7px 7px 13px 13px}
#medalCeremony .mc-medal:before{left:17px;background:linear-gradient(#59aafc,#1c70d2);transform:rotate(10deg)}
#medalCeremony .mc-medal:after{right:17px;background:linear-gradient(#ff7979,#d73535);transform:rotate(-10deg)}
#medalCeremony .mc-medalFace{
  position:absolute;z-index:2;left:50%;bottom:0;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff7c5,#ffd84b 48%,#e39b12 100%);border:6px solid #fff3ac;
  box-shadow:0 0 0 4px #b9780a,0 10px 18px rgba(100,59,0,.28);display:flex;align-items:center;justify-content:center;
  font-size:48px;color:#fff;text-shadow:0 3px 0 #b77600
}
#medalCeremony.award .mc-medal{animation:medalDrop .92s cubic-bezier(.22,.9,.28,1.1) forwards}
#medalCeremony .mc-glow{position:absolute;left:50%;top:210px;width:350px;height:350px;border-radius:50%;transform:translate(-50%,-50%) scale(.4);background:radial-gradient(circle,rgba(255,240,85,.78),rgba(255,232,47,.18) 42%,transparent 70%);opacity:0;z-index:2}
#medalCeremony.celebrate .mc-glow{animation:goldGlow 1.05s ease-out forwards}
#medalCeremony .mc-message{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);z-index:8;width:92%;font-size:clamp(17px,2.5vw,27px);font-weight:1000;color:#fff;text-shadow:0 3px 0 rgba(16,64,105,.65)}
#medalCeremony .mc-close{position:absolute;right:14px;top:14px;z-index:20;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#e94e4e;color:#fff;font-weight:1000;font-size:22px;box-shadow:0 4px 0 #a52626}
#medalCeremony .mc-previewTag{position:absolute;left:14px;top:14px;z-index:20;padding:6px 10px;border-radius:999px;background:rgba(70,49,160,.9);color:#fff;font-weight:900;font-size:12px;display:none}
#medalCeremony.preview .mc-previewTag{display:block}
.mc-confetti{position:absolute;z-index:15;width:10px;height:18px;border-radius:2px;top:-25px;pointer-events:none;animation:mcFall var(--dur) linear var(--delay) forwards;transform:translateX(var(--drift)) rotate(var(--rot))}
.mc-miniBurst{position:fixed;z-index:190000;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:miniBurst .9s ease-out forwards}
@keyframes ceremonyFade{from{opacity:0}to{opacity:1}}
@keyframes mcTwinkle{from{opacity:.35}to{opacity:.7}}
@keyframes playerArrive{from{transform:translateX(-50%) translateY(90px) scale(.82);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
@keyframes podiumRise{to{transform:translateX(-50%) translateY(0)}}
@keyframes medalDrop{0%{transform:translate(-50%,-220px) scale(.55);opacity:0}25%{opacity:1}72%{transform:translate(-50%,112px) scale(1.08)}88%{transform:translate(-50%,98px) scale(.97)}100%{transform:translate(-50%,104px) scale(1);opacity:1}}
@keyframes goldGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:.78;transform:translate(-50%,-50%) scale(1)}}
@keyframes mcFall{0%{transform:translateY(-30px) translateX(0) rotate(0);opacity:1}100%{transform:translateY(110vh) translateX(var(--drift)) rotate(var(--rot));opacity:.95}}
@keyframes miniBurst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(max-width:620px){
  #medalCeremony .mc-card{min-height:92vh}.mc-side{display:none!important}
  #medalCeremony .mc-stage{height:390px;bottom:25px}
  #medalCeremony .mc-player{width:190px;height:260px;bottom:112px}
  #medalCeremony .mc-podium{width:240px;height:120px}
  #medalCeremony .mc-medal{top:104px}
}
/* MEDAL_CEREMONY_END */
'''
          s = s.replace('</style>', css + '\n</style>', 1)

          ceremony_html = r'''
<!-- MEDAL_CEREMONY_HTML_START -->
<section id="medalCeremony" aria-hidden="true">
  <div class="mc-stars"></div>
  <div class="mc-card">
    <button class="mc-close" type="button" aria-label="Close medal ceremony" onclick="closeMedalCeremony()">×</button>
    <div class="mc-previewTag">TEACHER PREVIEW</div>
    <div class="mc-banner">🏆 GOLD MEDAL CEREMONY 🏆</div>
    <div class="mc-sub" id="mcSub">All 11 Sports Fiesta challenges completed perfectly!</div>
    <div class="mc-stage">
      <div class="mc-glow"></div>
      <div class="mc-side left"></div><div class="mc-side right"></div>
      <div class="mc-podium"></div>
      <img class="mc-player" id="mcPlayer" alt="Player 1 receiving a gold medal">
      <div class="mc-medal" aria-hidden="true"><div class="mc-medalFace">★</div></div>
      <div class="mc-message" id="mcMessage">Player 1, step onto the champion's rostrum!</div>
    </div>
  </div>
</section>
<!-- MEDAL_CEREMONY_HTML_END -->
'''
          marker = '<!-- SPORTS_FIESTA_COVER_END -->'
          s = s.replace(marker, marker + ceremony_html, 1)

          cover_btn = '<button class="fc-start" id="fcStart">★ START SPORTS FIESTA ★</button>'
          if cover_btn in s:
              s = s.replace(cover_btn, cover_btn + '<button class="fc-preview" type="button" onclick="unlockCeremonyPreview()">🔒 Preview Gold Medal Ceremony</button>', 1)

          reset_old = '<button id="resetBtn" class="resetBtn" type="button">Hold 5 Seconds to Reset</button>'
          reset_new = '<button class="previewCeremonyBtn" type="button" onclick="unlockCeremonyPreview()">🔒 Preview Medal Ceremony</button>\n      ' + reset_old
          s = s.replace(reset_old, reset_new, 1)

          # Extend reset to clear the final-ceremony shown flag.
          s = s.replace("localStorage.removeItem(STORAGE_KEY);", "localStorage.removeItem(STORAGE_KEY);\n    localStorage.removeItem(CEREMONY_SHOWN_KEY);", 1)

          # Trigger a small celebration when manual progress is positively recorded.
          s = s.replace("saveProgress(data);\n  renderAll();\n}\n\nfunction togglePerfect", "saveProgress(data);\n  if(state.completed) miniCelebrate(false);\n  renderAll();\n}\n\nfunction togglePerfect", 1)
          s = s.replace("saveProgress(data);\n  renderAll();\n}\n\nfunction reportFromGame", "saveProgress(data);\n  if(state.perfectSingle) miniCelebrate(true);\n  renderAll();\n}\n\nfunction reportFromGame", 1)
          s = s.replace("saveProgress(data);\n  renderAll();\n}\n\n// Optional auto-report", "saveProgress(data);\n  if(state.perfectSingle || state.completed) miniCelebrate(!!state.perfectSingle);\n  renderAll();\n}\n\n// Optional auto-report", 1)

          # Add auto-final ceremony logic to renderSummary.
          gold_block = '''  if(goldUnlocked){\n    goldNote.className = "goldNote goldUnlocked";\n    goldNote.textContent = "🏆 Gold Medal Unlocked! You completed all 11 practices perfectly in single-player mode!";\n  }else{\n    goldNote.className = "goldNote";\n    goldNote.textContent = "Not unlocked yet — keep going! 🌟";\n  }\n}'''
          gold_new = '''  if(goldUnlocked){\n    goldNote.className = "goldNote goldUnlocked";\n    goldNote.textContent = "🏆 Gold Medal Unlocked! You completed all 11 practices perfectly in single-player mode!";\n    if(localStorage.getItem(CEREMONY_SHOWN_KEY)!=="1") setTimeout(maybeAutoGoldCeremony, 450);\n  }else{\n    goldNote.className = "goldNote";\n    goldNote.textContent = "Not unlocked yet — keep going! 🌟";\n    localStorage.removeItem(CEREMONY_SHOWN_KEY);\n  }\n}'''
          if gold_block not in s:
              raise SystemExit('Could not find renderSummary gold block')
          s = s.replace(gold_block, gold_new, 1)

          # Inject ceremony JS just before the final renderAll() call near the end.
          anchor = '\nrenderAll();\n</script>'
          js = r'''

const CEREMONY_SHOWN_KEY = "sportsFiestaGoldCeremonyShown_v1";
let ceremonyAudioCtx = null;
let ceremonyTimers = [];
function getCeremonyAudio(){
  if(!ceremonyAudioCtx){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx) ceremonyAudioCtx=new Ctx();
  }
  if(ceremonyAudioCtx && ceremonyAudioCtx.state==="suspended") ceremonyAudioCtx.resume();
  return ceremonyAudioCtx;
}
function cTone(freq,dur=.12,type="triangle",vol=.045,delay=0){
  const ctx=getCeremonyAudio(); if(!ctx)return;
  const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.04);
}
function playDrumroll(){
  for(let i=0;i<10;i++){cTone(i%2?150:118,.07,"square",.026,i*.075)}
}
function playMedalDing(){cTone(880,.12,"sine",.05);cTone(1320,.28,"sine",.035,.09)}
function playGoldFanfare(){
  [523,659,784,1047].forEach((f,i)=>cTone(f,.28,"triangle",.045,i*.11));
  [659,784,1047,1319].forEach((f,i)=>cTone(f,.36,"sine",.03,.5+i*.08));
}
function playMiniChime(perfect){
  cTone(perfect?740:620,.09,"triangle",.03);cTone(perfect?1040:820,.14,"triangle",.032,.08);
}
function clearCeremonyTimers(){ceremonyTimers.forEach(clearTimeout);ceremonyTimers=[]}
function burstConfetti(count=90){
  const host=document.getElementById("medalCeremony");if(!host)return;
  const colors=["#ffd43b","#ff5b65","#45c8ff","#5bd96f","#9a67ff","#ff914d","#ffffff"];
  for(let i=0;i<count;i++){
    const p=document.createElement("i");p.className="mc-confetti";
    p.style.left=(Math.random()*100)+"vw";p.style.background=colors[i%colors.length];
    p.style.setProperty("--dur",(2.4+Math.random()*2.1)+"s");p.style.setProperty("--delay",(Math.random()*.45)+"s");
    p.style.setProperty("--drift",((-110+Math.random()*220))+"px");p.style.setProperty("--rot",((Math.random()*900-450))+"deg");
    host.appendChild(p);setTimeout(()=>p.remove(),5000);
  }
}
function miniCelebrate(perfect=false){
  playMiniChime(perfect);
  const colors=["#ffd43b","#ff5b65","#45c8ff","#5bd96f","#9a67ff"];
  for(let i=0;i<(perfect?34:20);i++){
    const p=document.createElement("i");p.className="mc-miniBurst";
    p.style.left="50vw";p.style.top="45vh";p.style.background=colors[i%colors.length];
    const a=(Math.PI*2*i)/(perfect?34:20),d=70+Math.random()*(perfect?190:120);
    p.style.setProperty("--x",Math.cos(a)*d+"px");p.style.setProperty("--y",Math.sin(a)*d+"px");p.style.setProperty("--r",(Math.random()*700-350)+"deg");
    document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
  }
}
function getPlayer1Source(){
  const fc=document.getElementById("fcP1");if(fc&&fc.src)return fc.src;
  const first=document.querySelector(".playerCard img");return first?first.src:"";
}
function showMedalCeremony(preview=false){
  const el=document.getElementById("medalCeremony");if(!el)return;
  clearCeremonyTimers();
  el.querySelectorAll(".mc-confetti").forEach(x=>x.remove());
  el.classList.remove("award","celebrate","preview");
  if(preview)el.classList.add("preview");
  document.getElementById("mcPlayer").src=getPlayer1Source();
  document.getElementById("mcSub").textContent=preview?"Password accepted — medal ceremony preview":"All 11 Sports Fiesta challenges completed perfectly!";
  document.getElementById("mcMessage").textContent="Player 1, step onto the champion's rostrum!";
  el.classList.add("show");el.setAttribute("aria-hidden","false");
  if(!preview)localStorage.setItem(CEREMONY_SHOWN_KEY,"1");
  playDrumroll();
  ceremonyTimers.push(setTimeout(()=>{el.classList.add("award");document.getElementById("mcMessage").textContent="Presenting the Sports Fiesta Gold Medal…";playMedalDing()},900));
  ceremonyTimers.push(setTimeout(()=>{el.classList.add("celebrate");document.getElementById("mcMessage").textContent="🏆 GOLD MEDAL CHAMPION — WELL DONE, PLAYER 1! 🏆";playGoldFanfare();burstConfetti(115)},1900));
}
function closeMedalCeremony(){
  clearCeremonyTimers();const el=document.getElementById("medalCeremony");if(!el)return;
  el.classList.remove("show","award","celebrate","preview");el.setAttribute("aria-hidden","true");
  el.querySelectorAll(".mc-confetti").forEach(x=>x.remove());
}
function maybeAutoGoldCeremony(){
  if(localStorage.getItem(CEREMONY_SHOWN_KEY)==="1")return;
  if(document.body.classList.contains("cover-on")){ceremonyTimers.push(setTimeout(maybeAutoGoldCeremony,650));return;}
  showMedalCeremony(false);
}
function unlockCeremonyPreview(){
  const pw=window.prompt("Enter password to preview the gold medal ceremony:");
  if(pw===null)return;
  if(pw.trim()==="67")showMedalCeremony(true);
  else window.alert("Incorrect password.");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMedalCeremony()});
'''
          if anchor not in s:
              raise SystemExit('Could not find final renderAll anchor')
          s = s.replace(anchor, js + anchor, 1)
          p.write_text(s, encoding='utf-8')
          print('Installed medal ceremony, sounds, confetti and password preview.')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Add gold medal ceremony preview and celebrations"
          git push
