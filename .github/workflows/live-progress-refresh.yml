name: Live Progress Refresh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live hub refresh listeners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SF_LIVE_PROGRESS_REFRESH_V1'
          if marker not in s:
              js='''\n<!-- SF_LIVE_PROGRESS_REFRESH_V1 -->\n<script>\n(function(){\n  const KEY='sportsFiestaHubProgress_v1';\n  function refreshHub(){ if(typeof renderAll==='function') renderAll(); }\n  window.addEventListener('storage',function(e){ if(e.key===KEY) refreshHub(); });\n  window.addEventListener('focus',refreshHub);\n  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refreshHub(); });\n})();\n</script>\n'''
              s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh hub progress immediately after practice completion"
          git push
