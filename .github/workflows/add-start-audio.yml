name: Add Sports Fiesta Start Audio
on:
  push:
    paths:
      - '.github/workflows/add-start-audio.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore audio and connect it to Start
        run: |
          base64 -d .audio_parts/start_audio_web.b64 > sports_fiesta_kindergarten_v2.mp3
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          audio="sports_fiesta_kindergarten_v2.mp3?v=20260812a"
          old="if(btn)btn.addEventListener('click',function(){document.body.classList.remove('cover-on');document.getElementById('fiestaCover').style.display='none';window.scrollTo(0,0);});"
          new="if(btn)btn.addEventListener('click',function(){try{const a=new Audio('"+audio+"');a.volume=1;a.play().catch(()=>{});}catch(e){}document.body.classList.remove('cover-on');document.getElementById('fiestaCover').style.display='none';window.scrollTo(0,0);});"
          if audio in s:
              print('Start audio already connected')
          else:
              if s.count(old)!=1:
                  raise SystemExit(f'Expected exactly one Start handler, found {s.count(old)}')
              s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sports_fiesta_kindergarten_v2.mp3
          git diff --cached --quiet || git commit -m 'Play Sports Fiesta audio after Start'
          git push
