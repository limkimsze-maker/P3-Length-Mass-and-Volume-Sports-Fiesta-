name: Apply Sports Fiesta Award Rules V1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Install Sports Fiesta award rules v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply award rules
        run: |
          python scripts/apply_award_rules_v1.py
          node --check sports-fiesta-medal-hook-v4.js
          node --check sports-fiesta-awards-v1.js
          node --check sports-fiesta-award-ui-v2.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-fiesta-medal-hook-v4.js index.html
          git diff --cached --quiet || git commit -m "Apply Sports Fiesta award rules v1"
          git push
