name: Separate 2P Gold and 1P Pieces
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/separate_duel_gold_from_pieces.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sports-fiesta-medal-hook-v4.js
          git commit -m "Keep 2P gold separate from 1P medal pieces"
          git push
