name: Fix 2P Gold Final Score
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2-player gold rule
        run: python scripts/fix_2p_gold.py
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-fiesta-medal-hook-v4.js
          git commit -m "Award 2P gold only to final higher scorer"
          git push
