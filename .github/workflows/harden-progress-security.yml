name: Harden Sports Fiesta Progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-progress-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove progress loopholes and require verified game completion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          # 1) Strip legacy report query parameters before any awarding code can read them.
          head_marker = 'SF_PROGRESS_SECURITY_HEAD_V1'
          if head_marker not in s:
              early = '''\n<!-- SF_PROGRESS_SECURITY_HEAD_V1 -->\n<script>\n(function(){\n  try{\n    const u=new URL(location.href);\n    let changed=false;\n    ['report','completed','perfect'].forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true;}});\n    if(changed) history.replaceState({},'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')+u.hash);\n  }catch(e){}\n})();\n</script>\n'''
              s = s.replace('</head>', early + '\n</head>', 1)

          # 2) Genuine shared-hook completions are verified. Preserve genuine v4 records via lastWinner.
          verified_fn = '''\nfunction isVerifiedProgressState(state){\n  return !!state && state.completed === true && (\n    state.verified === true ||\n    state.source === "game-v5" ||\n    typeof state.lastWinner === "string"\n  );\n}\n'''
          if 'function isVerifiedProgressState(state)' not in s:
              anchor = '''function ensureState(data, id){\n  if(!data[id]) data[id] = {completed:false, perfectSingle:false, updatedAt:null};\n  return data[id];\n}\n'''
              if anchor not in s:
                  raise SystemExit('ensureState anchor not found')
              s = s.replace(anchor, anchor + verified_fn, 1)

          # 3) Only verified states count towards pieces/perfect gold.
          s = s.replace('if(s.completed) completed++;', 'if(isVerifiedProgressState(s)) completed++;')
          s = s.replace('if(s.perfectSingle) perfect++;', 'if(isVerifiedProgressState(s) && s.perfectSingle) perfect++;')

          old_status = '''function statusInfo(state){\n  if(state.perfectSingle) return {text:"🏅 Perfect 1P", cls:"statusPerfect"};\n  if(state.completed) return {text:"✅ Completed", cls:"statusDone"};\n  return {text:"🌟 Not Yet", cls:"statusTodo"};\n}'''
          new_status = '''function statusInfo(state){\n  if(!isVerifiedProgressState(state)) return {text:"🌟 Not Yet", cls:"statusTodo"};\n  if(state.perfectSingle) return {text:"🏅 Perfect 1P", cls:"statusPerfect"};\n  return {text:"✅ Completed", cls:"statusDone"};\n}'''
          if old_status in s:
              s = s.replace(old_status, new_status, 1)

          s = s.replace(
              'const extraClass = state.perfectSingle ? "cardPerfect" : (state.completed ? "cardDone" : "");',
              'const verifiedState = isVerifiedProgressState(state);\n    const extraClass = verifiedState && state.perfectSingle ? "cardPerfect" : (verifiedState ? "cardDone" : "");'
          )

          # 4) Perfect-count helper used by the ceremony must also ignore unverified data.
          s = re.sub(
              r'function perfects\(\)\{const d=data\(\);let n=0;for\(let i=1;i<=11;i\+\+\)if\(d\[i\]&&d\[i\]\.perfectSingle\)n\+\+;return n\}',
              'function perfects(){const d=data();let n=0;for(let i=1;i<=11;i++)if(d[i]&&d[i].perfectSingle&&isVerifiedProgressState(d[i]))n++;return n}',
              s
          )

          # 5) Remove the obsolete URL-report block entirely.
          s = re.sub(
              r'// Optional auto-report via URL query, e\.g\. \?report=11&completed=1&perfect=1\s*\(function parseReportQuery\(\)\{.*?\}\)\(\);',
              '// URL-based progress reporting disabled: completion must come from the practice hook.',
              s,
              flags=re.S
          )

          # 6) Add final runtime guards against hidden/manual JS writer functions.
          tail_marker = 'SF_PROGRESS_SECURITY_RUNTIME_V1'
          if tail_marker not in s:
              guard = '''\n<!-- SF_PROGRESS_SECURITY_RUNTIME_V1 -->\n<script>\n(function(){\n  const blocked=function(){\n    console.warn('Sports Fiesta progress is recorded only after a practice is completed.');\n    return {ok:false,reason:'game-completion-required'};\n  };\n  blocked.__sf=1;\n  window.toggleCompleted=blocked;\n  window.togglePerfect=blocked;\n  window.reportFromGame=blocked;\n  if(window.SportsFiestaAward){\n    window.SportsFiestaAward.record=blocked;\n    window.SportsFiestaAward.reset=blocked;\n  }\n  try{ localStorage.removeItem('sportsFiestaPendingAward_v1'); }catch(e){}\n  if(typeof renderAll==='function') renderAll();\n})();\n</script>\n'''
              s = s.replace('</body>', guard + '\n</body>', 1)

          # Update the on-page explanation so pupils/teachers know progress is automatic.
          s = s.replace(
              'Suggested automatic game integration: when a game ends, save a result into localStorage using the same key\n    as this hub. Example fields: <code>completed</code> and <code>perfectSingle</code>.',
              'Progress is recorded automatically only after a practice reaches its genuine end screen. Replaying a practice is always allowed.'
          )

          if s == old:
              print('No changes needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('Progress security hardened')
          PY

      - name: Commit hardened hub
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Require verified game completion for Sports Fiesta medals"
          git push
