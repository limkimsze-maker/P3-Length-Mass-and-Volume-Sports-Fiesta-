name: Validate Sports Fiesta Shared Scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shared-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared JavaScript
        run: |
          node --check sports-fiesta-awards-v1.js
          node --check sports-fiesta-award-ui-v2.js
          node --check sports-fiesta-back-to-hub-v1.js
          node --check sports-fiesta-preview-menu-v1.js
          node --check tie-ceremony-two-players-v1.js
