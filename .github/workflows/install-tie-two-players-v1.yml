name: Install Two Player Tie Ceremony V1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-hub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load latest tie ceremony layout
        env:
          CACHE_KEY: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ.get('CACHE_KEY', 'latest')[:12]
          tag = f'<script src="tie-ceremony-two-players-v1.js?v={version}"></script>'
          pattern = r'<script\s+src=["\']tie-ceremony-two-players-v1\.js(?:\?[^"\']*)?["\']\s*></script>'

          if re.search(pattern, s):
              updated = re.sub(pattern, tag, s, count=1)
          else:
              updated = s.replace('</body>', tag + '\n</body>', 1)

          if updated != s:
              p.write_text(updated, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refresh two-player tie ceremony script"
          git push
