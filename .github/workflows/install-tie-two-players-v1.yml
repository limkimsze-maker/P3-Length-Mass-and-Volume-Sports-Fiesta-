name: Refresh Sports Fiesta Shared Scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-shared-scripts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh shared script cache tags
        env:
          CACHE_KEY: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ.get('CACHE_KEY', 'latest')[:12]
          updated = s

          def refresh_file(text, filename):
              pattern = re.compile(
                  r'(<script\b[^>]*\bsrc=["\'][^"\']*' +
                  re.escape(filename) +
                  r')(?:\?[^"\']*)?(["\'][^>]*></script>)'
              )
              return pattern.sub(lambda m: m.group(1) + '?v=' + version + m.group(2), text)

          updated = refresh_file(updated, 'sports-fiesta-awards-v1.js')
          updated = refresh_file(updated, 'tie-ceremony-two-players-v1.js')
          updated = refresh_file(updated, 'sports-fiesta-preview-menu-v1.js')

          if updated != s:
              p.write_text(updated, encoding='utf-8')
          PY

          node --check sports-fiesta-awards-v1.js
          node --check sports-fiesta-preview-menu-v1.js
          node --check tie-ceremony-two-players-v1.js

      - name: Commit refreshed cache tags
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refresh Sports Fiesta shared scripts"
          git push
