name: Install Two Player Tie Ceremony V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load tie ceremony layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="tie-ceremony-two-players-v1.js?v=20260810a"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Show both players clearly for tie ceremony"
          git push
