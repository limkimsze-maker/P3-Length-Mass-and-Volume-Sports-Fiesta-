name: Live Real Next Audit v3
on:
  push:
    paths:
      - '.github/workflows/live-real-next-audit-v3.yml'
permissions:
  contents: read
jobs:
  exact-real-flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {p: 1, path: 'P3-1-Recall-of-Length-', levels: 'none'}
          - {p: 2, path: 'P3-2.-Length-Conversion', levels: 'easy,intermediate,hard'}
          - {p: 3, path: 'P3-3-Recall-of-Mass', levels: 'none'}
          - {p: 4, path: 'P3-4-Mass-Reading', levels: 'none'}
          - {p: 5, path: 'P3-5-Mass-Conversion', levels: 'easy,intermediate,hard'}
          - {p: 6, path: 'P3-6-Recall-Volume', levels: 'none'}
          - {p: 7, path: 'P3-7-Reading-of-Volume', levels: 'easy,intermediate,hard'}
          - {p: 8, path: 'P3-8-measuring-volumes-in-litres-and-millimetres', levels: 'easy,intermediate'}
          - {p: 9, path: 'P3-9-measuring-volumes-in-litres-and-mililitres', levels: 'easy,intermediate'}
          - {p: 10, path: 'P3-10-Recall-Word-Problems', levels: 'none'}
          - {p: 11, path: 'P3-11-Length-Mass-and-Volume-Word-Problems', levels: 'none'}
    name: P${{ matrix.p }} exact Next
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Real answers then Next
        env:
          P: ${{ matrix.p }}
          PATH_PART: ${{ matrix.path }}
          LEVELS: ${{ matrix.levels }}
        run: |
          python - <<'PY'
          import os,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          p=int(os.environ['P']); path=os.environ['PATH_PART']; levels=os.environ['LEVELS'].split(',')
          url='https://limkimsze-maker.github.io/'+path+'/'
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1440,1000');o.add_argument('--autoplay-policy=no-user-gesture-required')
          d=webdriver.Chrome(options=o)
          solve=r'''
          const p=arguments[0], mode=arguments[1];
          const setv=(el,v)=>{el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};
          const norm=x=>String(x??'').replace(/\s+/g,' ').trim();
          const clickExact=(nodes,target)=>{const b=[...nodes].find(x=>norm(x.textContent)===norm(target));if(!b)throw new Error('correct option not found: '+target);b.click();};
          if(p===1){const q=questions[round],sel=mode===2?'#p1answers .panswer':'#soloAnswers .answer';clickExact(document.querySelectorAll(sel),q.answer);return 'option';}
          if(p===2){const q=currentQuestion;if(q.mode==='choice'){clickExact(document.querySelectorAll('.choiceBtn'),q.correct);return 'choice';}q.fields.forEach(id=>setv(document.getElementById(id),q.expected[id]));document.getElementById('checkBtn').click();return 'inputs';}
          if(p===3){const q=qs[idx];clickExact(document.querySelectorAll('.ans'),q.a);return 'option';}
          if(p===4){const q=questions[round],t=q.totalGrams;setv(document.getElementById('kgInput'),Math.floor(t/1000));setv(document.getElementById('gInput'),t%1000);document.getElementById('checkBtn').click();return 'mass';}
          if(p===5){const q=questions[round],ins=inputs();if(ins.length!==q.answers.length)throw new Error('input/answer mismatch '+ins.length+'/'+q.answers.length);ins.forEach((el,i)=>setv(el,q.answers[i]));document.getElementById('checkBtn').click();return 'inputs';}
          if(p===6||p===7){const q=questions[round];setv(document.getElementById('answerInput'),q.answer);document.getElementById('checkBtn').click();return 'input';}
          if(p===8){const q=questions[round],t=q.totalMl;setv(document.getElementById('litreInput'),Math.floor(t/1000));setv(document.getElementById('mlInput'),t%1000);document.getElementById('checkBtn').click();return 'volume';}
          if(p===9||p===10||p===11){const q=questions[round];q.fields.forEach(id=>setv(document.getElementById(id),q.expected[id]));document.getElementById('checkBtn').click();return 'fields';}
          throw new Error('unknown practice');
          '''
          try:
            for level in levels:
              lev=None if level=='none' else level
              for mode in (1,2):
                label=f'P{p} {lev or "standard"} {mode}P'
                d.get(url+'?audit='+str(time.time()));time.sleep(.9)
                if lev:
                  if not d.execute_script("if(typeof setDifficulty==='function'){setDifficulty(arguments[0]);return true}return false",lev):raise RuntimeError(label+': no difficulty setter')
                started=d.execute_script("if(typeof startGame==='function'){startGame(arguments[0]);return true}if(typeof start==='function'){start(arguments[0]);return true}return false",mode)
                if not started:raise RuntimeError(label+': no start function')
                time.sleep(.45)
                for step in range(2):
                  before=d.execute_script("return (document.getElementById('round')||document.querySelector('.round'))?.textContent?.trim()||''")
                  how=d.execute_script(solve,p,mode)
                  def ready(_):
                    return d.execute_script("const b=document.getElementById('nextBtn')||document.getElementById('next');if(!b)return false;const s=getComputedStyle(b);return s.display!=='none'&&s.visibility!=='hidden'&&!b.disabled")
                  WebDriverWait(d,15).until(ready)
                  d.execute_script("(document.getElementById('nextBtn')||document.getElementById('next')).click()")
                  def advanced(_):
                    return d.execute_script("const r=document.getElementById('results');const now=(document.getElementById('round')||document.querySelector('.round'))?.textContent?.trim()||'';return !!(r&&r.classList.contains('active'))||now!==arguments[0]",before)
                  WebDriverWait(d,8).until(advanced)
                  after=d.execute_script("return (document.getElementById('round')||document.querySelector('.round'))?.textContent?.trim()||'RESULTS'")
                  print(label,'step',step+1,how,before,'->',after)
                print(label,'PASS')
          finally:d.quit()
          PY
