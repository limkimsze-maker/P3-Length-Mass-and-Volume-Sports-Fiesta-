name: Rebuild Sports Fiesta Cover

on:
  push:
    paths:
      - '.github/scripts/rebuild_cover.py'
      - '.github/scripts/repair_ceremony.py'
      - '.github/scripts/responsive_display.py'
      - '.github/workflows/rebuild-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild cover and sport list
        run: python .github/scripts/rebuild_cover.py
      - name: Apply responsive display rules
        run: python .github/scripts/responsive_display.py
      - name: Verify medal ceremony and password preview
        run: python .github/scripts/repair_ceremony.py
      - name: Commit updated hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Sports Fiesta display responsive across devices"
          git push
