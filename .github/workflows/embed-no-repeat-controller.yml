name: Embed Sports Fiesta No-Repeat Controller
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed latest no-repeat controller in shared hook
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hook = Path('sports-fiesta-medal-hook-v4.js')
          controller = Path('sports-fiesta-2p-12-round-v1.js').read_text(encoding='utf-8').strip()
          text = hook.read_text(encoding='utf-8')
          start = '/* SF_NO_REPEAT_EMBED_START */'
          end = '/* SF_NO_REPEAT_EMBED_END */'
          block = f"{start}\n{controller}\n{end}"
          if start in text and end in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + block + text[b:]
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          hook.write_text(text, encoding='utf-8')
          PY
      - name: Commit shared hook update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-fiesta-medal-hook-v4.js
          git commit -m "Apply no-repeat rounds to all Sports Fiesta practices"
          git push
