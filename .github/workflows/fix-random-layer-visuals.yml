name: Strengthen random question duplicate detection
on:
  push:
    paths:
      - '.github/workflows/fix-random-layer-visuals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Atomically normalize duplicate fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, time, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/sports-fiesta-random-questions-v1.js'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          old="        if (k === 'render') return undefined;\n        return v;"
          new="        if (k === 'render') return undefined;\n        if ((k === 'options' || k === 'o') && Array.isArray(v)) return [...v].map(String).sort();\n        return v;"
          for attempt in range(8):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: data=json.load(r)
              text=base64.b64decode(data['content']).decode()
              if "k === 'options'" in text: raise SystemExit(0)
              if old not in text: raise SystemExit('Fingerprint target not found')
              text=text.replace(old,new,1)
              payload=json.dumps({'message':'Ignore option order when detecting duplicate questions','content':base64.b64encode(text.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
              req=urllib.request.Request(url,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
              try:
                  urllib.request.urlopen(req).read(); raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422): raise
                  time.sleep(2)
          raise SystemExit('Could not update shared random layer')
          PY
