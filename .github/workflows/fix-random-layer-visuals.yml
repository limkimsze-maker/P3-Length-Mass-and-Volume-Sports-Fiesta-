name: Strengthen random question duplicate detection
on:
  push:
    paths:
      - '.github/workflows/fix-random-layer-visuals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize answer choices in duplicate fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sports-fiesta-random-questions-v1.js')
          s=p.read_text()
          old="        if (k === 'render') return undefined;\n        return v;"
          new="        if (k === 'render') return undefined;\n        if ((k === 'options' || k === 'o') && Array.isArray(v)) return [...v].map(String).sort();\n        return v;"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check sports-fiesta-random-questions-v1.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sports-fiesta-random-questions-v1.js
          git diff --cached --quiet || git commit -m "Ignore option order when detecting duplicate questions"
          git push
